<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Advisors Hub</title>
<style>
:root{--red:#B8292F;--black:#111;--white:#fff;--soft:#f1f1f1;--mute:#7a7a7a}
*{box-sizing:border-box;margin:0}
body{background:#e9e9e9;color:var(--black);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
.page{width:100%;max-width:440px;min-height:100vh;background:var(--white);position:relative;padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
.hero{height:360px;position:relative;background:#000;overflow:hidden}
.hero .photo{position:absolute;inset:0;background-size:cover;background-position:center top}
.hero .mark{position:absolute;left:50%;top:92px;width:170px;transform:translateX(-50%);filter:invert(1)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff)}
.tabs{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:16px;z-index:3;display:flex;background:rgba(255,255,255,.22);backdrop-filter:blur(8px);border-radius:999px;padding:4px;gap:2px}
.tabs button{width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tabs button.on{background:#000;color:#fff}
.xchg{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;z-index:3;border:0;border-radius:999px;background:rgba(255,255,255,.22);backdrop-filter:blur(8px);color:#fff;font-weight:600;font-size:14px;padding:0 16px;height:50px;display:flex;align-items:center;gap:8px;cursor:pointer}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.who{text-align:center;margin-top:-52px;position:relative;z-index:2;padding:0 20px}
.who h1{font-size:25px;font-weight:700;letter-spacing:-.02em;display:inline-flex;align-items:center;gap:8px}
.badge{width:22px;height:22px;border-radius:50%;background:var(--red);display:inline-flex;align-items:center;justify-content:center}
.badge svg{width:13px;height:13px;stroke:#fff;stroke-width:3}
.who p{color:var(--red);font-size:16px;font-weight:600;margin-top:4px;letter-spacing:.01em}
.round{display:flex;justify-content:center;gap:18px;margin:20px 0 18px}
.round a{width:58px;height:58px;border-radius:50%;background:var(--soft);color:var(--black);display:flex;align-items:center;justify-content:center}
.round a:active{background:var(--black);color:#fff}
.save{display:block;width:calc(100% - 56px);margin:0 28px;height:56px;border:0;border-radius:999px;background:var(--black);color:#fff;font-size:17px;font-weight:600;cursor:pointer}
.box{margin:24px 14px 0;background:var(--soft);border-radius:28px;padding:10px;display:grid;gap:10px}
.row{display:flex;align-items:center;gap:14px;background:#fff;border-radius:20px;padding:12px 14px;color:var(--black);text-decoration:none}
.row i{width:48px;height:48px;border-radius:50%;background:var(--black);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;font-style:normal;font-weight:700;font-size:18px}
.row b{display:block;font-weight:600;font-size:16px}
.row span{display:block;color:#e2767b;font-size:14px;margin-top:2px;direction:ltr;text-align:left}

.desc{text-align:center;color:var(--mute);font-size:14px;line-height:1.5;margin:16px 28px 0}
.hero.co{height:170px}
.hero.co .photo,.hero.co .mark{display:none!important}
.hero.co::after{display:none}
.avatar{width:112px;height:112px;border-radius:50%;background:#fff;border:5px solid #fff;margin:-56px auto 0;position:relative;z-index:2;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1.5px #dcdcdc}
.avatar img{width:62px}
#v2 .who{margin-top:14px}
.view{display:none}.view.on{display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:9}
.modal.on{display:flex}
.sheet{background:#fff;width:100%;max-width:440px;border-radius:28px 28px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-size:19px;margin-bottom:4px}
.sheet p{color:var(--mute);font-size:14px;margin-bottom:14px}
.sheet input{width:100%;height:50px;border:1.5px solid var(--soft);background:var(--soft);border-radius:14px;padding:0 14px;font-size:16px;margin-bottom:10px}
.sheet input:focus{outline:2px solid var(--red);background:#fff}
.sheet .save{width:100%;margin:6px 0 0}
.sheet .x{background:none;border:0;color:var(--mute);width:100%;padding:14px;font-size:15px;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--red);outline-offset:2px}
</style>
</head>

    <div class="who"><h1><span>Advisors Hub</span><span class="badge"><svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg></span></h1><p>For real estate and development</p></div>

<div class="modal" id="modal"><div class="sheet">
  <h2>Exchange contact</h2><p>Share your details and they go straight to <span id="mname"></span> on WhatsApp.</p>
  <input id="xn" placeholder="Your name" autocomplete="name">
  <input id="xp" placeholder="Your phone" inputmode="tel" autocomplete="tel">
  <button class="save" id="xsend">Send</button>
  <button class="x" id="xclose">Cancel</button>
</div></div>

<script>
// Edit this block only. One copy of the file per person.
var P = {
  name: "Your Name",
  title: "Real Estate Advisor",
  photo: "",                    // optional: image file or link of the person
  phone: "+201000000000",
  whatsapp: "201000000000",     // international format, no + or spaces
  email: "name@advisorshub.com",
  website: "https://advisorshub.com",
  instagram: "https://www.instagram.com/advisorshub",
  linkedin: "https://www.linkedin.com/company/advisors-hub"
};
var C = {  // company tab, same for everyone
  about: "Real estate advisory partnering with leading developers across Fifth Settlement, Sixth Settlement, Sheikh Zayed, North Coast and El Gouna.",
  phone: "+201000000000", email: "info@advisorshub.com", website: "https://advisorshub.com"
};

var $ = function(i){return document.getElementById(i)};
$("name").textContent = P.name; $("title").textContent = P.title; $("mname").textContent = P.name;
document.title = P.name + " | Advisors Hub";
if(P.photo){ $("photo").style.backgroundImage = "url('" + P.photo + "')"; $("mark").style.display = "none"; }
$("call").href = "tel:" + P.phone; $("mail").href = "mailto:" + P.email; $("web").href = P.website;
$("desc").textContent = C.about;

var I = {
  wa:'<svg viewBox="0 0 24 24"><path d="M3 21l1.6-4.7A8.5 8.5 0 1 1 8 19.5z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.5-2-1-1 .8c-1-.4-2-1.4-2.4-2.4l.8-1-1-2z"/></svg>',
  ig:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/></svg>',
  yt:'<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="m10 9 5 3-5 3z"/></svg>',
  ph:'<svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>',
  ml:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  gl:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>',
  pin:'<svg viewBox="0 0 24 24"><path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>'
};
var WA='#25D366', IG='linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)', LI='#0A66C2', GR='#8e8e8e';
function rows(box, list){
  list.forEach(function(x){
    if(!x[2]) return;
    var a = document.createElement("a"); a.className = "row"; a.href = x[2];
    if(x[2].indexOf("http") === 0) { a.target = "_blank"; a.rel = "noopener"; }
    a.innerHTML = '<i style="background:' + x[4] + '">' + x[0] + "</i><div><b>" + x[1] + "</b><span>" + x[3] + "</span></div>";
    $(box).appendChild(a);
  });
}
rows("links", [
  [I.wa,"WhatsApp", P.whatsapp ? "https://wa.me/" + P.whatsapp : "", "Message me", WA],
  [I.ig,"Instagram", P.instagram, "Follow us", IG],
  ["in","LinkedIn", P.linkedin, "Connect with me", LI]
]);
rows("co", [
  [I.ph,"Phone", C.phone ? "tel:" + C.phone : "", C.phone, GR],
  [I.ml,"Email", C.email ? "mailto:" + C.email : "", C.email, GR],
  [I.gl,"Website", C.website, C.website.replace(/^https?:\/\//,""), GR]
]);

function tab(n){
  $("v1").classList.toggle("on", n === 1); $("v2").classList.toggle("on", n === 2);
  $("t1").classList.toggle("on", n === 1); document.querySelector(".hero").classList.toggle("co", n === 2); $("t2").classList.toggle("on", n === 2);
}
$("t1").onclick = function(){tab(1)}; $("t2").onclick = function(){tab(2)};

$("xbtn").onclick = function(){$("modal").classList.add("on")};
$("xclose").onclick = function(){$("modal").classList.remove("on")};
$("xsend").onclick = function(){
  var n = $("xn").value.trim(), p = $("xp").value.trim();
  if(!n || !p){ (n ? $("xp") : $("xn")).focus(); return; }
  var msg = "Hi " + P.name + ", this is " + n + ". My number: " + p;
  window.location.href = "https://wa.me/" + P.whatsapp + "?text=" + encodeURIComponent(msg);
};

$("save").onclick = function(){
  var p = P.name.split(" ");
  var v = ["BEGIN:VCARD","VERSION:3.0","N:" + p.slice(1).join(" ") + ";" + p[0] + ";;;","FN:" + P.name,
    "ORG:Advisors Hub","TITLE:" + P.title,"TEL;TYPE=CELL:" + P.phone,"EMAIL:" + P.email,"URL:" + P.website,"END:VCARD"].join("\r\n");
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([v],{type:"text/vcard"}));
  a.download = P.name.replace(/\s+/g,"_") + ".vcf";
  document.body.appendChild(a); a.click(); a.remove();
};
</script>
</body>

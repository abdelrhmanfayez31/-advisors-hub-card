<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Your Name | Advisors Hub</title>
<style>
:root{--red:#B8292F;--black:#0a0a0a;--white:#fff;--grey:#f3f3f3;--mute:#6b6b6b}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f3f3f3;color:#0a0a0a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{min-height:100vh}
.page{width:100%;max-width:440px;min-height:100vh;margin:0 auto;background:#fff;overflow:hidden}
.cover{height:170px;background:#0a0a0a;position:relative;overflow:hidden}
.cover:after{content:"";position:absolute;inset:-60px -100px auto auto;width:260px;height:300px;background:#B8292F;transform:rotate(28deg)}
.brand{position:absolute;z-index:2;left:24px;top:34px;color:#fff;font-weight:800;font-size:24px;letter-spacing:.5px}
.brand small{display:block;font-size:9px;font-weight:500;letter-spacing:1.7px;margin-top:3px;opacity:.75}
.avatar{width:112px;height:112px;border-radius:50%;background:#fff;border:5px solid #fff;margin:-56px auto 0;position:relative;z-index:3;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #0a0a0a}
.avatar-mark{width:70px;height:70px;border-radius:50%;background:#0a0a0a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px}
.who{text-align:center;padding:14px 20px 0}
.who h1{font-size:24px;margin:0;font-weight:750}
.who p{color:#6b6b6b;font-size:14px;margin:5px 0 0}
.who p:after{content:"";display:block;width:36px;height:3px;background:#B8292F;margin:12px auto 0;border-radius:3px}
.round{display:flex;justify-content:center;gap:14px;margin:18px 0 16px}
.round a,.round button{width:48px;height:48px;border-radius:50%;border:1.5px solid #0a0a0a;background:#fff;color:#0a0a0a;display:flex;align-items:center;justify-content:center;padding:0;text-decoration:none}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.connect{display:block;width:calc(100% - 40px);margin:0 20px;background:#0a0a0a;color:#fff;text-align:center;text-decoration:none;font-weight:650;padding:15px;border-radius:999px;border-bottom:3px solid #B8292F}
.sheet{margin:22px 12px 0;background:#f3f3f3;border-radius:24px;padding:16px 8px 24px}
.sheet h2{text-align:center;font-size:13px;font-weight:600;color:#6b6b6b;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 4px}
.grid a{display:flex;flex-direction:column;align-items:center;gap:7px;color:#0a0a0a;text-decoration:none;font-size:12px}
.grid i{width:48px;height:48px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;box-shadow:0 1px 5px rgba(0,0,0,.08)}
.footer{text-align:center;padding:25px 20px 32px;font-weight:800}
.footer span{color:#B8292F}
</style>
</head>
<body>
<main class="page">
  <section class="cover">
    <div class="brand">ADVISORS <span style="color:#B8292F">HUB</span><small>REAL ESTATE</small></div>
  </section>

  <div class="avatar"><div class="avatar-mark">AH</div></div>

  <section class="who">
    <h1>Your Name</h1>
    <p>Real Estate Advisor</p>
  </section>

  <div class="round">
    <a href="tel:+201000000000" aria-label="Call">
      <svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
    </a>
    <a href="mailto:name@advisorshub.com" aria-label="Email">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
    </a>
    <a href="data:text/vcard;charset=utf-8,BEGIN%3AVCARD%0D%0AVERSION%3A3.0%0D%0AFN%3AYour%20Name%0D%0AORG%3AAdvisors%20Hub%0D%0ATITLE%3AReal%20Estate%20Advisor%0D%0ATEL%3A%2B201000000000%0D%0AEMAIL%3Aname%40advisorshub.com%0D%0AEND%3AVCARD" download="Your_Name.vcf" aria-label="Save contact">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M19 8v6M16 11h6"/></svg>
    </a>
  </div>

  <a class="connect" href="https://wa.me/201000000000">Connect with me</a>

  <section class="sheet">
    <h2>LET'S CONNECT</h2>
    <div class="grid">
      <a href="https://wa.me/201000000000"><i>WA</i>WhatsApp</a>
      <a href="https://www.instagram.com/advisorshub"><i>IG</i>Instagram</a>
      <a href="https://www.linkedin.com/company/advisors-hub"><i>in</i>LinkedIn</a>
      <a href="https://advisorshub.com"><i>www</i>Website</a>
    </div>
  </section>

  <div class="footer">ADVISORS <span>HUB</span></div>
</main>
</body>
</html>
